name: Checks

on:
  push:
    branches:
      - main
      - 'Feature/**'
      - 'Bugfix/**'
      - 'Enhance/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Regression (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pycolmap
      - name: Check pipeline syntax
        run: bash -n prior-pose-refine
      - name: Run regression tests and COLMAP round-trip
        run: python -I -B tests/test_prior_pose_refine.py -v
